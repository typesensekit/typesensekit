  "ip-address": "^10.7.4"
  "qs": "^6.16.1"
  "sharp": "^0.35.5"
  "source-map-js": "^1.2.2"
  "undici": "^8.12.2"
  "@astrojs/sitemap>zod": "^4.6.6"
